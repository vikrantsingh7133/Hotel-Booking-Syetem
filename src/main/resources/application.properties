spring.application.name=hotel-booking-system

spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

# Unpaid bookings hold their rooms for this long, then the job expires them.
booking.hold-minutes=10
booking.expiry-job-interval-ms=30000
